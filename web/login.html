<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Hospital Management System</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Login page only: center one card on the page. */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 22px; border: 2px solid var(--card-border); box-shadow: var(--shadow); padding: 28px 26px; }
  .login-card .logo { margin: 0 auto 14px; }
  .login-card h1 { text-align: center; font-size: 24px; color: var(--title); margin: 0 0 4px; }
  .login-card .sub { text-align: center; color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
  .login-card .hint { text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" class="logo-cross"><path d="M26 10h12v16h16v12H38v16H26V38H10V26h16z" fill="currentColor"/></svg>
    </div>
    <h1>Hospital Management System</h1>
    <p class="sub">Please log in to continue</p>
    <form id="f-login" class="form-grid" method="POST" action="/login">
      <div class="field"><label>Username</label>
        <input type="text" name="username" placeholder="e.g. admin" required autofocus></div>
      <div class="field"><label>Password</label>
        <input type="password" name="password" placeholder="Your password" required></div>
      <div id="login-error"></div>
      <div class="btn-row"><button type="submit" class="btn btn-primary" style="flex:1">Log In</button></div>
    </form>
    <p class="hint muted">First run? Default Admin account is <b>admin / admin123</b> — change it after login.</p>
  </div>
</div>
<script>
  // Check URL query for error or logout
  const urlParams = new URLSearchParams(window.location.search);
  const errParam = urlParams.get("error");
  const isLogout = urlParams.get("logout");

  if (errParam) {
    document.getElementById("login-error").innerHTML =
      '<div class="msg msg-err">' + decodeURIComponent(errParam) + '</div>';
  }

  // If user is already logged in and not explicitly logging out, go to dashboard
  if (!isLogout) {
    const existingToken = localStorage.getItem("hms_token");
    if (existingToken) {
      fetch("/api/me", {
        headers: { "Authorization": "Bearer " + existingToken },
        credentials: "same-origin"
      }).then(r => r.json()).then(data => {
        if (data && data.ok) {
          window.location.replace("/index.html?token=" + encodeURIComponent(existingToken));
        }
      }).catch(() => {});
    }
  }

  const form = document.getElementById("f-login");
  const submitBtn = form.querySelector("button[type='submit']");
  const err = document.getElementById("login-error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.innerHTML = "";
    const f = new FormData(form);
    const username = (f.get("username") || "").trim();
    const password = (f.get("password") || "").trim();

    if (!username || !password) {
      err.innerHTML = '<div class="msg msg-err">Username aur password dono likhein.</div>';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username, password }),
      });
      let data = {};
      try { data = await res.json(); } catch(e){}

      if (res.ok && data.ok) {
        if (data.token) {
          try { localStorage.setItem("hms_token", data.token); } catch(e){}
          try { document.cookie = "hms_session=" + data.token + "; path=/; credentials=same-origin; max-age=43200; SameSite=Lax"; } catch(e){}
        }
        submitBtn.textContent = "Opening Dashboard...";
        const targetUrl = data.token ? ("/index.html?token=" + encodeURIComponent(data.token)) : "/index.html";
        window.location.replace(targetUrl);
        return;
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
        err.innerHTML = '<div class="msg msg-err">' + (data.error || "Wrong username or password.") + "</div>";
        return;
      }
    } catch (e) {
      // Fallback: submit natively
      form.submit();
    }
  });
</script>
</body>
</html>
