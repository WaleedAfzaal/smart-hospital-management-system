<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Care Hospital — Management System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="side-backdrop hidden" id="side-backdrop"></div>

  <!-- ======================= SIDEBAR ======================= -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="side-brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" class="logo-cross"><path d="M26 10h12v16h16v12H38v16H26V38H10V26h16z" fill="currentColor"/></svg>
      </div>
      <div class="side-brand-text">
        <div class="side-title">City Care Hospital</div>
        <div class="side-sub">Management System</div>
      </div>
    </div>

    <nav class="side-nav" id="side-nav"></nav>

    <div class="side-promo">
      <div class="side-promo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="promo-heart"><path d="M12 21s-7.8-4.7-10-9.3C.4 8.4 2.5 4.5 6 4.5c2 0 3.6 1.1 4.5 2.7h3C14.4 5.6 16 4.5 18 4.5c3.5 0 5.6 3.9 4 7.2C19.8 16.3 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 12h4l2-3 3 6 2-3h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="side-promo-text"><b>Better Care</b><span>A Healthier Tomorrow</span></div>
    </div>
    <div class="side-version">Version 1.0.0</div>
  </aside>

  <!-- ======================= MAIN ======================= -->
  <div class="app-main">
    <header class="app-topbar">
      <button id="nav-toggle" class="icon-btn" type="button" title="Show / hide menu" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" class="search-ic" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="global-search" type="text" placeholder="Search patients, doctors, appointments..." autocomplete="off" aria-label="Search patients, doctors, appointments">
        <div id="search-results" class="search-results hidden" role="listbox"></div>
      </div>

      <div class="top-right">
        <div class="bell-wrap">
          <button id="bell-btn" class="icon-btn" type="button" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9zM10 20a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="bell-badge" class="bell-badge hidden">0</span>
          </button>
          <div id="bell-panel" class="pop-panel hidden"></div>
        </div>

        <div class="profile-wrap">
          <button id="profile-btn" class="profile-btn" type="button" aria-label="Account menu">
            <span class="avatar" id="profile-avatar">A</span>
            <span class="profile-text">
              <span id="profile-name">Admin</span>
              <span id="profile-role">Administrator</span>
            </span>
            <span class="caret" aria-hidden="true">▾</span>
          </button>
          <div id="profile-menu" class="pop-panel hidden">
            <button type="button" id="menu-change-pw">Change Password</button>
            <button type="button" id="menu-theme">Dark Mode</button>
            <button type="button" id="menu-undo">Undo Last Action</button>
            <button type="button" id="menu-logout">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-content">
      <!-- Step 7 dashboard: sidebar layout from the design image, real data only -->
      <section id="dashboard-view" aria-label="Dashboard"></section>

      <!-- Every other module opens here (same renderers as before) -->
      <section id="module-view" class="workspace hidden" aria-label="Module">
        <div class="workspace-head">
          <h2 id="workspace-title">Dashboard</h2>
          <span class="workspace-sub" id="workspace-sub"></span>
        </div>
        <div class="workspace-body" id="workspace-body">
          <p class="hint">Loading…</p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span class="dot-ok" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
      <span class="sep">•</span>
      <span>Last update: <span id="last-update">—</span></span>
    </footer>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
